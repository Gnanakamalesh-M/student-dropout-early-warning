server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths are client-side routes, not 404s. Without
    # this, a refresh on /students/ABC-123 returns nginx's 404 instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves browsers holding a stale bundle that references deleted chunks.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Mirrors the API's own headers so the served HTML carries them too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
