name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Python 3.10 is pinned project-wide; see ADR-0004 (SHAP/XGBoost wheels).
  PYTHON_VERSION: "3.10"

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Run tests
        env:
          ENVIRONMENT: ci
        run: pytest -m "not integration" --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  leakage:
    # A dedicated job so a leakage regression shows as its own failed check
    # rather than being buried in the general test output (ADR-0003). This is
    # the guarantee the whole project rests on, so it gets top billing.
    name: Leakage guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: As-of property test and feature allowlist
        env:
          ENVIRONMENT: ci
        run: pytest tests/ml -m ml -q

  database:
    # The local test suite runs against SQLite, which does not exercise JSONB,
    # partial index predicates, server-side defaults, or PostgreSQL's stricter
    # type coercion. This job closes that gap on the real engine.
    name: Database (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ews
          POSTGRES_PASSWORD: ews
          POSTGRES_DB: ews_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,api]"
      - name: Migration round trip
        env:
          DATABASE_URL: postgresql+psycopg://ews:ews@localhost:5432/ews_test
        run: |
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini downgrade base
          alembic -c backend/alembic.ini upgrade head
      - name: Schema and repository tests against PostgreSQL
        env:
          ENVIRONMENT: ci
          TEST_DATABASE_URL: postgresql+psycopg://ews:ews@localhost:5432/ews_test
        run: pytest tests/integration/test_database.py -m integration -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build is part of CI because a type error that only surfaces during
      # bundling — or a Plotly trace missing from the basic distribution — would
      # otherwise reach deployment.
      - run: npm run build
