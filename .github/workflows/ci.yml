name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Python 3.10 is pinned project-wide; see ADR-0004 (SHAP/XGBoost wheels).
  PYTHON_VERSION: "3.10"

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Run tests
        env:
          ENVIRONMENT: ci
        run: pytest -m "not integration" --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  leakage:
    # A dedicated job so a leakage regression shows as its own failed check
    # rather than being buried in the general test output (ADR-0003). This is
    # the guarantee the whole project rests on, so it gets top billing.
    name: Leakage guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: As-of property test and feature allowlist
        env:
          ENVIRONMENT: ci
        run: pytest tests/ml -m ml -q

  # Later phases will add:
  #   - an `integration` job with a postgres service container
  #   - a `frontend` job (vitest)
