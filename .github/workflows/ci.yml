name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Python 3.10 is pinned project-wide; see ADR-0004 (SHAP/XGBoost wheels).
  PYTHON_VERSION: "3.10"

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # ".[dev,api]", not ".[dev]": tests/api and tests/integration import
      # `backend.app`, which needs fastapi, sqlalchemy and alembic -- all in the
      # `api` extra. `-m "not integration"` deselects by marker, but pytest must
      # still IMPORT each module to read its markers, so a missing dependency is a
      # collection error. Collection errors interrupt the run with exit code 2
      # before any test executes and before coverage.xml is written, which is
      # exactly how this job was failing.
      - run: pip install -e ".[dev,api]"
      - name: Run tests
        env:
          ENVIRONMENT: ci
        run: pytest -m "not integration" --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  leakage:
    # A dedicated job so a leakage regression shows as its own failed check
    # rather than being buried in the general test output (ADR-0003). This is
    # the guarantee the whole project rests on, so it gets top billing.
    name: Leakage guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: As-of property test and feature allowlist
        env:
          ENVIRONMENT: ci
        run: pytest tests/ml -m ml -q

  database:
    # The local test suite runs against SQLite, which does not exercise JSONB,
    # partial index predicates, server-side defaults, or PostgreSQL's stricter
    # type coercion. This job closes that gap on the real engine.
    name: Database (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ews
          POSTGRES_PASSWORD: ews
          POSTGRES_DB: ews_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,api]"
      - name: Migration round trip
        env:
          DATABASE_URL: postgresql+psycopg://ews:ews@localhost:5432/ews_test
        run: |
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini downgrade base
          alembic -c backend/alembic.ini upgrade head
      - name: Schema and repository tests against PostgreSQL
        env:
          ENVIRONMENT: ci
          TEST_DATABASE_URL: postgresql+psycopg://ews:ews@localhost:5432/ews_test
        run: pytest tests/integration/test_database.py -m integration -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build is part of CI because a type error that only surfaces during
      # bundling — or a Plotly trace missing from the basic distribution — would
      # otherwise reach deployment.
      - run: npm run build

  containers:
    # This job exists because Docker is not available on the machine this project
    # was developed on. The Dockerfiles, nginx config and compose file have never
    # been built or run by their author, so this is the only thing that verifies
    # them -- it is a real gate, not a nicety.
    #
    # It deliberately does not need a trained model: `load_state()` records a load
    # error rather than raising, so the API boots and /health reports "degraded".
    # That is enough to prove the image runs, the migrations apply against real
    # PostgreSQL, and the dashboard serves its SPA fallback. What it cannot prove
    # is that a *scoring* request works in a container, because models/ is not
    # committed.
    name: Container build & stack smoke test
    runs-on: ubuntu-latest
    # Job-level, not step-level. docker-compose.yml declares SECRET_KEY with the
    # required-variable form `${SECRET_KEY:?...}`, so *every* command that parses
    # the file needs it -- including `logs` and `down`. With it set only on the
    # boot and migration steps, `docker compose down -v` (if: always()) exited 1
    # and failed the job even when every check had passed, and the "Dump logs on
    # failure" step failed the same way, destroying the diagnostics for any real
    # failure. Reproduced locally: with no .env and SECRET_KEY unset, `down`,
    # `logs` and `ps` all exit 1 with "required variable SECRET_KEY is missing".
    # The required-variable guard itself is deliberate and stays.
    env:
      SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
      ENVIRONMENT: local
      REPOSITORY_BACKEND: database
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ews-api:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: ews-dashboard:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The API image must not run as root
        run: |
          user=$(docker run --rm ews-api:local id -un)
          echo "container user: $user"
          test "$user" = "ews"

      - name: XGBoost and SHAP must import inside the image
        # libgomp1 is a *runtime* dependency of XGBoost. Without it the import
        # fails with "libgomp.so.1: cannot open shared object file", which reads
        # like a missing Python package and is not one. This is the check that
        # the two-stage build did not drop it.
        run: |
          docker run --rm ews-api:local python -c "
          import xgboost, shap, sklearn, fastapi
          print('xgboost', xgboost.__version__)
          print('shap', shap.__version__)
          "

      - name: No build toolchain left in the runtime image
        # The builder stage installs build-essential to compile wheels. If it
        # leaks into the runtime stage the image is much larger and ships a
        # compiler next to student records.
        run: |
          if docker run --rm ews-api:local sh -c "command -v gcc"; then
            echo "::error::gcc present in the runtime image; the build stage leaked"
            exit 1
          fi
          echo "no compiler in runtime image"

      - name: Boot the stack
        run: |
          mkdir -p models data/processed
          # --no-build: the images were built above and tagged with the names
          # compose declares, so this starts those exact images instead of
          # building a second, unasserted copy.
          docker compose up -d --no-build db
          docker compose up -d --no-build api dashboard
          docker compose ps

      - name: Migrations must apply against real PostgreSQL
        run: |
          docker compose exec -T api alembic -c backend/alembic.ini upgrade head
          docker compose exec -T api alembic -c backend/alembic.ini downgrade base
          docker compose exec -T api alembic -c backend/alembic.ini upgrade head

      - name: API must answer /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          # "degraded" is the expected state with no model artifact mounted. The
          # assertion is that the endpoint answers and reports honestly, not that
          # it claims to be ready.
          grep -q '"environment":"local"' /tmp/health.json

      - name: API must send its security headers
        run: |
          curl -fsSI http://localhost:8000/health | tee /tmp/headers.txt
          grep -qi "x-content-type-options: nosniff" /tmp/headers.txt
          grep -qi "x-frame-options: DENY" /tmp/headers.txt
          grep -qi "referrer-policy: no-referrer" /tmp/headers.txt
          grep -qi "cache-control: no-store" /tmp/headers.txt
          # force_https is off here, so HSTS must be absent.
          if grep -qi "strict-transport-security" /tmp/headers.txt; then
            echo "::error::HSTS sent over plain HTTP"
            exit 1
          fi

      - name: Dashboard must serve the app and fall back for client routes
        run: |
          curl -fsS http://localhost:8080/ | grep -qi "<div id=\"root\""
          # A refresh on a client-side route must return index.html, not a 404.
          # Without try_files this is the bug users hit first.
          curl -fsS http://localhost:8080/students/ABC-123 | grep -qi "<div id=\"root\""

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
