# Risk band configuration.
#
# CALIBRATED. Derived by scripts/train_model.py from model artifact
# xgboost-20260927T073831Z on the held-out validation presentation (2014B), using the
# procedure the Phase 1 placeholder version of this file specified:
#
#   The CRITICAL cutoff is set from SUPPORT CAPACITY, not from where the
#   probability distribution bends. `alert_budget` in features.yaml is the share
#   of the cohort an institution can follow up in one cycle; the CRITICAL band is
#   sized to it, and HIGH and MEDIUM widen from there.
#
# These cutoffs are still an INSTITUTIONAL POLICY CHOICE, not a validated risk
# scale. A different institution with different staffing should re-derive them by
# re-running the training script with its own alert_budget.
#
# Per-band precision, recall and lift on validation: reports/model/risk_bands.csv
#
# Caveat that matters operationally: isotonic calibration is piecewise-constant,
# so many students share the exact boundary probability (2,124 at the CRITICAL
# cutoff). A boundary is therefore not meaningful separation between adjacent
# students.

version: 2
name: budget-calibrated-v1
calibrated: true
bands:
- key: low
  label: Low
  min_probability: 0.0
  color: '#2E7D32'
  action: No outreach. Included in routine cohort monitoring.
- key: medium
  label: Medium
  min_probability: 0.02984
  color: '#F9A825'
  action: Passive monitoring. Flag if risk rises for two consecutive checkpoints.
- key: high
  label: High
  min_probability: 0.05954
  color: '#EF6C00'
  action: Human review, then advisor outreach if the reviewer agrees.
- key: critical
  label: Critical
  min_probability: 0.09385
  color: '#C62828'
  action: Priority human review and coordinated support offer.
alerts:
  band_escalation:
    enabled: true
    into_bands:
    - high
    - critical
  rapid_increase:
    enabled: true
    # Measured against the calibrated probability scale, not guessed on a 0-1
    # one. Calibrated probabilities top out at 0.333 on test, so the Phase 1
    # placeholder of 0.15 fired on 0.11% of checkpoint-to-checkpoint transitions
    # -- effectively a dead alert. Of the increases that do occur, 0.05 is the
    # 95th percentile and fires on 2.2% of transitions, which is a plausible
    # volume for a "risk jumped sharply" signal.
    min_delta: 0.05
  sustained_increase:
    enabled: true
    consecutive_checkpoints: 3
governance:
  require_human_review_before_intervention: true
  auto_punitive_actions_permitted: false
